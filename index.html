<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Juego clásico de Snake con gráficos modernos, sistema de vidas y ranking">
    <meta name="author" content="Snake Game">
    <title>Snake Game - Juego de la Serpiente</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/tone@14.8.49/build/Tone.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
</head>
<body>
    <div class="container">
        <h1>🐍 Snake Game</h1>

        <!-- Información del juego -->
        <div class="game-info">
            <div class="info-item">
                <div class="info-label">Jugador</div>
                <div class="info-value" id="playerName">---</div>
            </div>
            <div class="info-item">
                <div class="info-label">Puntaje</div>
                <div class="info-value" id="score">0</div>
            </div>
            <div class="info-item lives">
                <div class="info-label">Vidas</div>
                <div class="info-value" id="lives">❤️❤️❤️</div>
            </div>
        </div>

        <!-- Canvas del juego -->
        <canvas id="gameCanvas" width="600" height="600"></canvas>

        <!-- Controles -->
        <div class="controls">
            <p><strong>Controles:</strong> Flechas ⬆️ ⬇️ ⬅️ ➡️ o teclas WASD</p>
            <p>Come las manzanas para crecer y ganar puntos</p>
            <button id="startBtn">Iniciar Juego</button>
            <button id="pauseBtn" style="display: none;">Pausar</button>
            <button id="muteBtn" title="Activar/Desactivar sonido">🔊 Sonido</button>
        </div>

        <!-- Versión -->
        <div class="version">v0.3</div>
    </div>

    <!-- Modal para ingresar nombre -->
    <div id="nameModal" class="modal active">
        <div class="modal-content">
            <h2>¡Bienvenido al Snake Game!</h2>
            <p>Ingresa tu nombre para comenzar:</p>
            <input
                type="text"
                id="playerNameInput"
                placeholder="Tu nombre"
                maxlength="20"
                autocomplete="off">
            <button id="startGameBtn">Comenzar</button>
        </div>
    </div>

    <!-- Modal de Game Over -->
    <div id="gameOverModal" class="modal">
        <div class="modal-content">
            <h2>¡Juego Terminado!</h2>
            <p class="game-over-text">
                Puntaje Final: <strong id="finalScore">0</strong>
            </p>
            <div class="ranking">
                <h3>🏆 Top 10 Ranking</h3>
                <ul class="ranking-list" id="rankingList"></ul>
            </div>
            <button id="playAgainBtn">Jugar de Nuevo</button>
        </div>
    </div>

    <!-- Scripts -->
    <script type="module" src="js/main.js"></script>
</body>
</html>
