<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game - Juego de la Serpiente</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 800px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #667eea;
            margin-bottom: 20px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .game-info {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 10px;
            color: white;
            font-weight: bold;
        }

        .info-item {
            text-align: center;
        }

        .info-label {
            font-size: 0.9em;
            opacity: 0.9;
            margin-bottom: 5px;
        }

        .info-value {
            font-size: 1.5em;
        }

        .lives {
            color: #ff6b6b;
        }

        #gameCanvas {
            display: block;
            margin: 0 auto;
            border: 4px solid #667eea;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            background: #1a1a2e;
        }

        .controls {
            text-align: center;
            margin-top: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
        }

        .controls p {
            margin: 5px 0;
            color: #666;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            margin: 10px 5px;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        button:active {
            transform: translateY(0);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            max-width: 500px;
            width: 90%;
            text-align: center;
        }

        .modal h2 {
            color: #667eea;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 2px solid #667eea;
            border-radius: 10px;
            font-size: 1em;
            outline: none;
        }

        input:focus {
            border-color: #764ba2;
            box-shadow: 0 0 10px rgba(102, 126, 234, 0.3);
        }

        .ranking {
            margin-top: 20px;
            text-align: left;
        }

        .ranking-list {
            list-style: none;
            padding: 0;
        }

        .ranking-item {
            padding: 10px;
            margin: 5px 0;
            background: #f8f9fa;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .ranking-item.top-1 {
            background: linear-gradient(135deg, #ffd700 0%, #ffed4e 100%);
            font-weight: bold;
        }

        .ranking-item.top-2 {
            background: linear-gradient(135deg, #c0c0c0 0%, #e8e8e8 100%);
            font-weight: bold;
        }

        .ranking-item.top-3 {
            background: linear-gradient(135deg, #cd7f32 0%, #daa520 100%);
            font-weight: bold;
        }

        .rank-position {
            font-weight: bold;
            margin-right: 10px;
            color: #667eea;
        }

        .game-over-text {
            font-size: 1.2em;
            margin-bottom: 15px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🐍 Snake Game</h1>

        <div class="game-info">
            <div class="info-item">
                <div class="info-label">Jugador</div>
                <div class="info-value" id="playerName">---</div>
            </div>
            <div class="info-item">
                <div class="info-label">Puntaje</div>
                <div class="info-value" id="score">0</div>
            </div>
            <div class="info-item lives">
                <div class="info-label">Vidas</div>
                <div class="info-value" id="lives">❤️❤️❤️</div>
            </div>
        </div>

        <canvas id="gameCanvas" width="600" height="600"></canvas>

        <div class="controls">
            <p><strong>Controles:</strong> Usa las flechas del teclado ⬆️ ⬇️ ⬅️ ➡️</p>
            <p>Come las manzanas para crecer y ganar puntos</p>
            <button id="startBtn">Iniciar Juego</button>
            <button id="pauseBtn" style="display: none;">Pausar</button>
        </div>
    </div>

    <!-- Modal para ingresar nombre -->
    <div id="nameModal" class="modal active">
        <div class="modal-content">
            <h2>¡Bienvenido al Snake Game!</h2>
            <p>Ingresa tu nombre para comenzar:</p>
            <input type="text" id="playerNameInput" placeholder="Tu nombre" maxlength="20">
            <button id="startGameBtn">Comenzar</button>
        </div>
    </div>

    <!-- Modal de Game Over -->
    <div id="gameOverModal" class="modal">
        <div class="modal-content">
            <h2>¡Juego Terminado!</h2>
            <p class="game-over-text">Puntaje Final: <strong id="finalScore">0</strong></p>
            <div class="ranking">
                <h3>🏆 Top 10 Ranking</h3>
                <ul class="ranking-list" id="rankingList"></ul>
            </div>
            <button id="playAgainBtn">Jugar de Nuevo</button>
        </div>
    </div>

    <script>
        // Configuración del juego
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        // Estado del juego
        let game = {
            snake: [],
            dx: 0,
            dy: 0,
            food: { x: 0, y: 0 },
            score: 0,
            lives: 3,
            playerName: '',
            isRunning: false,
            isPaused: false,
            gameLoop: null,
            speed: 100
        };

        // Elementos del DOM
        const nameModal = document.getElementById('nameModal');
        const gameOverModal = document.getElementById('gameOverModal');
        const playerNameInput = document.getElementById('playerNameInput');
        const startGameBtn = document.getElementById('startGameBtn');
        const startBtn = document.getElementById('startBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const playAgainBtn = document.getElementById('playAgainBtn');
        const scoreDisplay = document.getElementById('score');
        const livesDisplay = document.getElementById('lives');
        const playerNameDisplay = document.getElementById('playerName');
        const finalScoreDisplay = document.getElementById('finalScore');
        const rankingList = document.getElementById('rankingList');

        // Inicializar el juego
        function initGame() {
            game.snake = [
                { x: 15, y: 15 },
                { x: 14, y: 15 },
                { x: 13, y: 15 }
            ];
            game.dx = 1;
            game.dy = 0;
            game.score = 0;
            game.lives = 3;
            placeFood();
            updateDisplay();
        }

        // Colocar comida
        function placeFood() {
            do {
                game.food.x = Math.floor(Math.random() * tileCount);
                game.food.y = Math.floor(Math.random() * tileCount);
            } while (isOnSnake(game.food.x, game.food.y));
        }

        // Verificar si una posición está en la serpiente
        function isOnSnake(x, y) {
            return game.snake.some(segment => segment.x === x && segment.y === y);
        }

        // Dibujar el juego
        function draw() {
            // Fondo con patrón de cuadrícula
            ctx.fillStyle = '#1a1a2e';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Dibujar cuadrícula sutil
            ctx.strokeStyle = 'rgba(102, 126, 234, 0.1)';
            ctx.lineWidth = 1;
            for (let i = 0; i < tileCount; i++) {
                ctx.beginPath();
                ctx.moveTo(i * gridSize, 0);
                ctx.lineTo(i * gridSize, canvas.height);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, i * gridSize);
                ctx.lineTo(canvas.width, i * gridSize);
                ctx.stroke();
            }

            // Dibujar comida (manzana con estilo)
            const foodX = game.food.x * gridSize;
            const foodY = game.food.y * gridSize;

            // Manzana con gradiente
            const gradient = ctx.createRadialGradient(
                foodX + gridSize / 2,
                foodY + gridSize / 2,
                0,
                foodX + gridSize / 2,
                foodY + gridSize / 2,
                gridSize / 2
            );
            gradient.addColorStop(0, '#ff6b6b');
            gradient.addColorStop(1, '#c92a2a');

            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(foodX + gridSize / 2, foodY + gridSize / 2, gridSize / 2 - 2, 0, Math.PI * 2);
            ctx.fill();

            // Hoja de la manzana
            ctx.fillStyle = '#51cf66';
            ctx.beginPath();
            ctx.ellipse(foodX + gridSize / 2 + 4, foodY + 4, 3, 6, Math.PI / 4, 0, Math.PI * 2);
            ctx.fill();

            // Dibujar serpiente
            game.snake.forEach((segment, index) => {
                const x = segment.x * gridSize;
                const y = segment.y * gridSize;

                if (index === 0) {
                    // Cabeza de la serpiente con gradiente
                    const headGradient = ctx.createLinearGradient(x, y, x + gridSize, y + gridSize);
                    headGradient.addColorStop(0, '#51cf66');
                    headGradient.addColorStop(1, '#37b24d');
                    ctx.fillStyle = headGradient;
                    ctx.fillRect(x + 1, y + 1, gridSize - 2, gridSize - 2);

                    // Ojos
                    ctx.fillStyle = 'white';
                    const eyeSize = 4;
                    if (game.dx === 1) { // Derecha
                        ctx.fillRect(x + gridSize - 8, y + 4, eyeSize, eyeSize);
                        ctx.fillRect(x + gridSize - 8, y + gridSize - 8, eyeSize, eyeSize);
                    } else if (game.dx === -1) { // Izquierda
                        ctx.fillRect(x + 4, y + 4, eyeSize, eyeSize);
                        ctx.fillRect(x + 4, y + gridSize - 8, eyeSize, eyeSize);
                    } else if (game.dy === -1) { // Arriba
                        ctx.fillRect(x + 4, y + 4, eyeSize, eyeSize);
                        ctx.fillRect(x + gridSize - 8, y + 4, eyeSize, eyeSize);
                    } else { // Abajo
                        ctx.fillRect(x + 4, y + gridSize - 8, eyeSize, eyeSize);
                        ctx.fillRect(x + gridSize - 8, y + gridSize - 8, eyeSize, eyeSize);
                    }
                } else {
                    // Cuerpo de la serpiente
                    const bodyGradient = ctx.createLinearGradient(x, y, x + gridSize, y + gridSize);
                    const intensity = 1 - (index / game.snake.length) * 0.3;
                    bodyGradient.addColorStop(0, `rgba(81, 207, 102, ${intensity})`);
                    bodyGradient.addColorStop(1, `rgba(55, 178, 77, ${intensity})`);
                    ctx.fillStyle = bodyGradient;
                    ctx.fillRect(x + 2, y + 2, gridSize - 4, gridSize - 4);
                }

                // Borde brillante
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
                ctx.lineWidth = 2;
                ctx.strokeRect(x + 2, y + 2, gridSize - 4, gridSize - 4);
            });
        }

        // Actualizar el juego
        function update() {
            if (!game.isRunning || game.isPaused) return;

            // Mover la serpiente
            const head = { x: game.snake[0].x + game.dx, y: game.snake[0].y + game.dy };

            // Verificar colisión con paredes
            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                loseLife();
                return;
            }

            // Verificar colisión con el cuerpo
            if (isOnSnake(head.x, head.y)) {
                loseLife();
                return;
            }

            // Agregar nueva cabeza
            game.snake.unshift(head);

            // Verificar si comió
            if (head.x === game.food.x && head.y === game.food.y) {
                game.score += 10;
                placeFood();
                updateDisplay();

                // Aumentar velocidad gradualmente
                if (game.score % 50 === 0 && game.speed > 50) {
                    game.speed -= 5;
                    clearInterval(game.gameLoop);
                    game.gameLoop = setInterval(gameStep, game.speed);
                }
            } else {
                // Quitar la cola si no comió
                game.snake.pop();
            }

            draw();
        }

        // Perder una vida
        function loseLife() {
            game.lives--;
            updateDisplay();

            if (game.lives <= 0) {
                gameOver();
            } else {
                // Reiniciar posición de la serpiente
                game.snake = [
                    { x: 15, y: 15 },
                    { x: 14, y: 15 },
                    { x: 13, y: 15 }
                ];
                game.dx = 1;
                game.dy = 0;
                placeFood();
            }
        }

        // Game Over
        function gameOver() {
            game.isRunning = false;
            clearInterval(game.gameLoop);

            // Guardar puntaje
            saveScore(game.playerName, game.score);

            // Mostrar modal
            finalScoreDisplay.textContent = game.score;
            displayRanking();
            gameOverModal.classList.add('active');
        }

        // Actualizar displays
        function updateDisplay() {
            scoreDisplay.textContent = game.score;
            const hearts = '❤️'.repeat(game.lives) + '🖤'.repeat(3 - game.lives);
            livesDisplay.textContent = hearts;
            playerNameDisplay.textContent = game.playerName;
        }

        // Paso del juego
        function gameStep() {
            update();
        }

        // Iniciar el juego
        function startGame() {
            if (game.isRunning) {
                game.isPaused = !game.isPaused;
                pauseBtn.textContent = game.isPaused ? 'Reanudar' : 'Pausar';
                return;
            }

            initGame();
            game.isRunning = true;
            game.isPaused = false;
            game.speed = 100;

            if (game.gameLoop) clearInterval(game.gameLoop);
            game.gameLoop = setInterval(gameStep, game.speed);

            startBtn.style.display = 'none';
            pauseBtn.style.display = 'inline-block';
            draw();
        }

        // Sistema de ranking
        function saveScore(name, score) {
            let rankings = JSON.parse(localStorage.getItem('snakeRankings')) || [];
            rankings.push({ name, score, date: new Date().toISOString() });
            rankings.sort((a, b) => b.score - a.score);
            rankings = rankings.slice(0, 10); // Mantener solo top 10
            localStorage.setItem('snakeRankings', JSON.stringify(rankings));
        }

        function displayRanking() {
            const rankings = JSON.parse(localStorage.getItem('snakeRankings')) || [];
            rankingList.innerHTML = '';

            rankings.forEach((entry, index) => {
                const li = document.createElement('li');
                li.className = 'ranking-item';
                if (index === 0) li.classList.add('top-1');
                else if (index === 1) li.classList.add('top-2');
                else if (index === 2) li.classList.add('top-3');

                const medal = index === 0 ? '🥇' : index === 1 ? '🥈' : index === 2 ? '🥉' : '';
                li.innerHTML = `
                    <span><span class="rank-position">${index + 1}.</span> ${medal} ${entry.name}</span>
                    <span><strong>${entry.score}</strong> puntos</span>
                `;
                rankingList.appendChild(li);
            });

            if (rankings.length === 0) {
                rankingList.innerHTML = '<li class="ranking-item">No hay puntajes aún</li>';
            }
        }

        // Event Listeners
        startGameBtn.addEventListener('click', () => {
            const name = playerNameInput.value.trim();
            if (name) {
                game.playerName = name;
                nameModal.classList.remove('active');
                updateDisplay();
            } else {
                alert('Por favor ingresa tu nombre');
            }
        });

        playerNameInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                startGameBtn.click();
            }
        });

        startBtn.addEventListener('click', startGame);
        pauseBtn.addEventListener('click', startGame);

        playAgainBtn.addEventListener('click', () => {
            gameOverModal.classList.remove('active');
            startBtn.style.display = 'inline-block';
            pauseBtn.style.display = 'none';
            initGame();
            draw();
        });

        // Controles del teclado
        document.addEventListener('keydown', (e) => {
            if (!game.isRunning || game.isPaused) return;

            switch (e.key) {
                case 'ArrowUp':
                    if (game.dy === 0) {
                        game.dx = 0;
                        game.dy = -1;
                    }
                    e.preventDefault();
                    break;
                case 'ArrowDown':
                    if (game.dy === 0) {
                        game.dx = 0;
                        game.dy = 1;
                    }
                    e.preventDefault();
                    break;
                case 'ArrowLeft':
                    if (game.dx === 0) {
                        game.dx = -1;
                        game.dy = 0;
                    }
                    e.preventDefault();
                    break;
                case 'ArrowRight':
                    if (game.dx === 0) {
                        game.dx = 1;
                        game.dy = 0;
                    }
                    e.preventDefault();
                    break;
            }
        });

        // Inicializar
        initGame();
        draw();
        playerNameInput.focus();
    </script>
</body>
</html>
